[project]
name = "healloop"
version = "0.1.0"
description = "Closed-loop pytest healer: failing tests → GPT-6 FixPlan → apply unified diffs → re-run until green"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "pytest>=8.0",
  "unidiff>=0.7",
]

[project.scripts]
healloop = "healloop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["healloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "api.heal:handler"
